<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>智能定位</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">← 返回</a>
        <span class="navbar-text text-light">文件 <span th:text="${fileId}">0</span> / <span th:text="${fileType}">COREDUMP</span></span>
    </div>
</nav>
<div class="container" th:if="${diagnosis == null}">
    <div class="alert alert-warning">暂无可用的标准化特征（请先完成解析并等待 <code>PARSED</code>）。</div>
</div>
<div class="container" th:if="${diagnosis != null}">
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <h2 class="h5" th:text="${diagnosis.faultName}">故障</h2>
            <p class="mb-1"><span class="badge bg-primary" th:text="${diagnosis.faultCode}">CODE</span>
                <span class="text-muted ms-2">置信度</span>
                <span th:text="${#numbers.formatDecimal(diagnosis.confidence, 1, 4)}">0</span>
            </p>
            <hr/>
            <h3 class="h6">根因提示</h3>
            <ul>
                <li th:each="h : ${diagnosis.rootCauseHints}" th:text="${h}">hint</li>
            </ul>
        </div>
    </div>
    <div class="card shadow-sm mb-3">
        <div class="card-header">修复建议（知识图谱）</div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item" th:each="r : ${diagnosis.repairSuggestions}">
                <div class="fw-semibold" th:text="${r.title}">title</div>
                <div class="small text-muted" th:text="${r.repairCode}">code</div>
                <pre class="small bg-light p-2 mt-2 mb-0" th:text="${r.steps}">steps</pre>
            </li>
        </ul>
    </div>
    <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary"
           th:href="|/api/platform/report/${fileId}?fileType=${fileType}|">导出 Markdown</a>
        <a class="btn btn-outline-secondary"
           th:href="|/api/platform/report/${fileId}/pdf?fileType=${fileType}|">导出 PDF</a>
    </div>
</div>
</body>
</html>
