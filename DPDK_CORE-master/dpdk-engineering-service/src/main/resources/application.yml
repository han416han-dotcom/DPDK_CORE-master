spring:
  application:
    name: dpdk-fault-analysis-platform
  datasource:
    url: jdbc:mysql://localhost:3306/dpdk_coredump?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      location: ${java.io.tmpdir}
      max-file-size: 500MB
      max-request-size: 500MB
  thymeleaf:
    cache: false

file:
  storage:
    path: D:\workspace\data\dpdk-collector
    coredump-dir: coredumps/
    log-dir: logs/
    temp-dir: temp/

scan:
  enable: true
  interval: 30000
  coredump-paths: F:/var/core,F:/tmp
  log-paths: F:/var/log/dpdk,F:/opt/dpdk/app/logs
  file-patterns:
    coredump: "core.*"
    log: "*.log"

dpdk:
  ai:
    cnn-embedding-dim: 32

  collector:
    parse:
      # LOCAL_GDB / WSL2_GDB / REMOTE_SSH
      backend: LOCAL_GDB

server:
  port: 8080
  tomcat:
    basedir: ${java.io.tmpdir}
